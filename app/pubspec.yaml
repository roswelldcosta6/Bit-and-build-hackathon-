name: signbridge
description: SignBridge — Real-Time Indian Sign Language Translation App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management — Riverpod
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Navigation
  go_router: ^14.0.0

  # Camera
  camera: ^0.11.0+1

  # On-device ML: MediaPipe via Google ML Kit
  google_mlkit_pose_detection: ^0.11.0
  google_mlkit_face_detection: ^0.11.0

  # TFLite on-device inference
  tflite_flutter: ^0.11.0

  # Text-to-Speech
  flutter_tts: ^4.0.0

  # Audio recording for Mode B
  record: ^5.0.4

  # HTTP client
  dio: ^5.4.0

  # File system & assets
  path_provider: ^2.1.0
  path: ^1.8.0

  # UI utilities
  shimmer: ^3.0.0

  # Permissions
  permission_handler: ^11.3.0

dependency_overrides:
  record_platform_interface: 1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/model.tflite
    - assets/labels_bilingual.json
    - assets/clips/

  # fonts:
